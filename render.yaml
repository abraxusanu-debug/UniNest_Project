services:
  - type: web
    name: uninest
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: UNINEST_SECRET_KEY
        generateValue: true
      - key: UNINEST_JWT_KEY
        generateValue: true
      - key: UNINEST_BOOTSTRAP_ADMIN
        value: true
      - key: UNINEST_ADMIN_EMAIL
        value: admin@uninest.ac.ke
      - key: UNINEST_ADMIN_PASSWORD
        value: Admin@123
      - key: DATABASE_URL
        fromDatabase:
          name: uninest-db
          property: connectionString

databases:
  - name: uninest-db
    databaseName: uninest
    user: uninest
