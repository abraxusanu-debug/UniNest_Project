{% extends "base.html" %}
{% block container_class %}narrow{% endblock %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="brand-lg"><span class="logo">U</span><span style="font-weight:800; font-size:17px">UniNest</span></div>
  <h1>Forgot password</h1>
  <p class="auth-sub">Enter your email and we will send a reset link if an account exists.</p>

  <form method="post" class="stack">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@student.ac.ke" required autofocus>
    </div>
    <button class="btn primary block" type="submit">Send reset link</button>
  </form>

  <div class="auth-alt"><a href="{{ url_for('web.login') }}">Back to log in</a></div>
</div>
{% endblock %}
