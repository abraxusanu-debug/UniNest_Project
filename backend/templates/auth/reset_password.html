{% extends "base.html" %}
{% block container_class %}narrow{% endblock %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="brand-lg"><span class="logo">U</span><span style="font-weight:800; font-size:17px">UniNest</span></div>
  <h1>Reset your password</h1>
  <p class="auth-sub">Choose a new password for your UniNest account.</p>

  <form method="post" class="stack">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required autofocus>
    </div>
    <button class="btn primary block" type="submit">Update password</button>
  </form>

  <div class="auth-alt"><a href="{{ url_for('web.login') }}">Back to log in</a></div>
</div>
{% endblock %}
